[project]
name = "cross-border-scout"
version = "0.1.0"
description = "跨境电商选品策略分析平台"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "loguru>=0.7.2",
    "apscheduler>=3.10.4",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.2.0",
    "langchain-core>=1.0.0",
    "langchain-openai>=1.0.0",
    "langchain-anthropic>=1.0.0",
    "langgraph>=0.2.0",
    "PySide6>=6.7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2.0"]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]
asyncio_mode = "auto"
